<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} - Finance Management</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='auth.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <div class="auth-card">
        {% if action == 'register' %}
        <h1 class="auth-title">Register</h1>
        {% else %}
        <h1 class="auth-title">Login</h1>
        {% endif %} {% if action == 'register' %}
        <form
          method="POST"
          action="{{ url_for('main.auth', action='register') }}"
          class="auth-form"
        >
          <div class="form-group">
            <i class="fas fa-user form-icon"></i>
            <input
              type="text"
              name="username"
              placeholder="Username"
              required
            />
          </div>
          <div class="form-group">
            <i class="fas fa-envelope form-icon"></i>
            <input type="email" name="email" placeholder="Email" required />
          </div>
          <div class="form-group">
            <i class="fas fa-lock form-icon"></i>
            <input
              type="password"
              name="password"
              placeholder="Password"
              required
            />
          </div>
          <div class="form-group">
            <i class="fas fa-lock form-icon"></i>
            <input
              type="password"
              name="confirm_password"
              placeholder="Confirm Password"
              required
            />
          </div>
          <button type="submit" class="auth-button">
            <i class="fas fa-user-plus"></i> Register
          </button>
          <p class="auth-link">
            Already have an account?
            <a href="{{ url_for('main.auth', action='login') }}">Login</a>
          </p>
        </form>
        {% else %}
        <form
          method="POST"
          action="{{ url_for('main.auth', action='login') }}"
          class="auth-form"
        >
          <div class="form-group">
            <i class="fas fa-envelope form-icon"></i>
            <input type="email" name="email" placeholder="Email" required />
          </div>
          <div class="form-group">
            <i class="fas fa-lock form-icon"></i>
            <input
              type="password"
              name="password"
              placeholder="Password"
              required
            />
          </div>
          <button type="submit" class="auth-button">
            <i class="fas fa-sign-in-alt"></i> Login
          </button>
          <p class="auth-link">
            Don't have an account?
            <a href="{{ url_for('main.auth', action='register') }}">Register</a>
          </p>
        </form>
        {% endif %}
      </div>
    </div>

    <div class="social-links">
      <a
        href="https://github.com/UtkayBattal"
        target="_blank"
        class="social-icon"
      >
        <i class="fab fa-github"></i>
      </a>
      <a
        href="https://www.linkedin.com/in/utkay-güngör-battal-951497263/"
        target="_blank"
        class="social-icon"
      >
        <i class="fab fa-linkedin-in"></i>
      </a>
    </div>

    <footer>
      <p>© 2024 Finance Management | Secure and Easy Financial Management</p>
    </footer>
  </body>
</html>
